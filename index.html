<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#50583e"><title>Bøgegården – Rengøring & vedligehold</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Bøgegården"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#30382a;background:#f5f0e6}*{box-sizing:border-box}body{margin:0}header{background:#50583e;color:#fff;padding:24px 18px 20px}header h1{font:700 37px Georgia,serif;margin:0}header p{margin:4px 0 0;color:#eee9d9;font-size:14px}.wrap{max-width:850px;margin:auto;padding:16px}nav,.filters{display:flex;gap:7px;overflow:auto;padding:0 0 12px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 13px;background:#e2e5d6;color:#30382a}button.active,.primary{background:#50583e;color:#fff}button.warn{background:#f2dfd1;color:#88432e}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.panel{background:#fffdf8;border:1px solid #e4e1d5;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 9px #3331}.task{display:flex;gap:10px;align-items:flex-start}.task .body{flex:1}.task h3{margin:0 0 4px;font-size:16px}.muted{color:#6e7569;font-size:13px}.pill{display:inline-block;background:#e6ebde;border-radius:20px;padding:3px 9px;font-size:12px;margin-top:8px}.late{background:#f4ded1;color:#91452c}.done{background:#dcebd8;color:#315d38}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:13px;padding:7px 10px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd0c3;border-radius:9px;background:#fff}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}dialog{border:0;border-radius:18px;width:min(95vw,520px);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 15px 60px #0005}dialog::backdrop{background:#1d261a88}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:35px;text-align:center;color:#6b7468}.foot{font-size:12px;color:#6c7568;text-align:center;margin:24px 0}.room{display:flex;align-items:center;justify-content:space-between;gap:8px}.room b{font-size:15px}@media(max-width:500px){header h1{font-size:31px}.grid{grid-template-columns:1fr}} 
:root{--green:#60764C;--yellow:#E8B83F;--red:#C4454B}.panel{background:#fff}.task{display:block}.task-head{display:flex;align-items:flex-start;gap:10px}.status-dot{width:13px;height:13px;border-radius:50%;flex:none;margin-top:5px}.status-red{background:var(--red)}.status-yellow{background:var(--yellow)}.status-green{background:var(--green)}.task-head .body{min-width:0}.task-meta{margin:9px 0 0 23px;line-height:1.7;font-size:13px;color:#596354}.task-state{font-size:12px;font-weight:700;white-space:nowrap;margin-left:auto}.state-red{color:#C4454B}.state-yellow{color:#85630D}.state-green{color:#60764C}.actions{margin-left:23px}.actions .primary{background:var(--green)}.actions details{position:relative}.actions summary{list-style:none;cursor:pointer;background:#f2f0ea;border-radius:10px;padding:8px 12px;font-size:13px}.actions summary::-webkit-details-marker{display:none}.actions .more{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 18px}.stat{background:white;border-radius:13px;text-align:center;padding:12px 4px}.stat strong{font-size:24px;display:block}.section-title{font:700 19px Georgia,serif;margin:22px 0 10px}.date-line{font-size:12px;color:#697062;margin-top:2px}.empty-small{font-size:13px;color:#687064;padding:15px 2px}.history-link{margin-left:23px;font-size:12px;padding:4px 0;background:transparent;color:#4f6441;text-decoration:underline}.task .actions button{padding:9px 12px}
</style></head><body>
<header><div style="max-width:850px;margin:auto"><h1>Bøgegården</h1><p>RENGØRING & VEDLIGEHOLD</p></div></header><main class="wrap"><nav id="tabs"></nav><div class="filters" id="areas"></div><div class="top"><h2 id="heading" style="font:700 24px Georgia,serif;margin:8px 0">Opgaver</h2><div><button id="roomAdd">+ Område</button> <button class="primary" id="taskAdd">+ Opgave</button></div></div><div id="content"></div><p class="foot">Denne prøveversion gemmer kun data på denne enhed. Deling og synkronisering kommer senere.</p></main>
<dialog id="taskDialog"><form id="taskForm"><h2 id="taskFormTitle">Opgave</h2><input type="hidden" name="id"><label>Opgave</label><input name="title" required maxlength="120"><label>Område</label><select name="room" id="roomSelect" required></select><div class="grid"><div><label>Gentagelse</label><select name="frequency"><option value="1">Dagligt</option><option value="7">Ugentligt</option><option value="14">Hver 14. dag</option><option value="21">Hver 3. uge</option><option value="30">Hver 30. dag</option><option value="90">Hvert kvartal (90 dage)</option><option value="365">Årligt (365 dage)</option><option value="0">Engangsopgave</option></select></div><div><label>Ansvarlig</label><select name="assignee"><option value="Fælles">Fælles</option><option value="Mig">Mig</option><option value="Michael">Michael</option></select></div></div><label>Næste dato</label><input name="due" type="date" required><label>Noter (valgfrit)</label><textarea name="notes" rows="2"></textarea><div class="actions" style="justify-content:flex-end"><button type="button" onclick="taskDialog.close()">Annuller</button><button class="primary" type="submit">Gem opgave</button></div></form></dialog>
<dialog id="roomDialog"><form id="roomForm"><h2>Opret område</h2><label>Navn (fx Silo eller Stald)</label><input name="name" required maxlength="60"><label>Placering</label><select name="kind"><option>Indendørs</option><option>Udendørs</option></select><div class="actions" style="justify-content:flex-end"><button type="button" onclick="roomDialog.close()">Annuller</button><button class="primary" type="submit">Opret</button></div></form></dialog>
<script>
const KEY='boegegaarden_v1';const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const plus=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialRooms=[['Køkken','Indendørs'],['Baggang','Indendørs'],['Vindfang','Indendørs'],['Badeværelse','Indendørs'],['Spisestue','Indendørs'],['Soveværelse','Indendørs'],['Tøjværelse','Indendørs'],['Vinkelstue','Indendørs'],['TV-stue','Indendørs'],['Kontor','Indendørs'],['Trappe og repos','Indendørs'],['Gæsteværelse','Indendørs'],['Stald','Udendørs'],['Silo','Udendørs'],['Gårdsplads','Udendørs'],['Allé','Udendørs'],['Have','Udendørs']].map(([name,kind])=>({id:uid(),name,kind}));
const seed=[['Rengør køkkenbord og spiseplads','Køkken',1],['Støvsug køkken efter behov','Køkken',1],['Støvsug baggang efter behov','Baggang',1],['Rengør badeværelse','Badeværelse',7],['Grundig rengøring af køkken','Køkken',7],['Støvsug og tør støv af','Spisestue',7],['Støvsug soveværelse','Soveværelse',7],['Skift sengetøj','Soveværelse',14],['Rengør kontor','Kontor',7],['Støvsug trappe og repos','Trappe og repos',7],['Vask trappe og repos','Trappe og repos',30],['Rengør vinkelstue','Vinkelstue',7],['Rengør TV-stue','TV-stue',7],['Rengør gæsteværelse','Gæsteværelse',21],['Rengør brusevægge og kanter grundigt','Badeværelse',90],['Rengør de to resterende køkkenvinduesfag','Køkken',0]].map(([title,room,frequency])=>({id:uid(),title,room:initialRooms.find(r=>r.name===room).id,frequency,assignee:'Fælles',due:today(),notes:''}));
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.rooms)||!Array.isArray(db.tasks)){db={rooms:initialRooms,tasks:seed,history:[]}}db.history??=[];let tab='today',area='Alle';function save(){localStorage.setItem(KEY,JSON.stringify(db))}save();const getRoom=id=>db.rooms.find(r=>r.id===id);const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'});
function historyFor(t){return db.history.filter(h=>h.taskId===t.id||(!h.taskId&&h.title===t.title&&h.room===t.room)).sort((a,b)=>b.date.localeCompare(a.date))}
function taskStatus(t){let h=historyFor(t),last=h[0],partial=last?.partial===true;let finishedToday=h.some(x=>x.date===today()&&!x.partial);if(partial)return {name:'Delvist udført',color:'yellow'};if(t.due<today())return {name:'Overskredet',color:'red'};if(t.due===today())return {name:'I dag',color:'red'};return {name:'Ajour',color:'green'}}
function taskCard(t){let r=getRoom(t.room),h=historyFor(t),last=h[0],lastFull=h.find(x=>!x.partial),status=taskStatus(t),partial=last?.partial===true;let lastLabel=lastFull?fmt(lastFull.date):'Ingen registreret';let partialLabel=partial?`<div>Delvist udført: <b>${fmt(last.date)}</b>${last.note?' · '+esc(last.note):''}</div>`:'';return `<article class="panel task"><div class="task-head"><span class="status-dot status-${status.color}" aria-hidden="true"></span><div class="body"><h3>${esc(t.title)}</h3><div class="muted">${esc(r?.name||'Ukendt område')} · ${esc(t.assignee)}</div>${t.notes?`<div class="date-line">${esc(t.notes)}</div>`:''}</div><span class="task-state state-${status.color}">${status.name}</span></div><div class="task-meta"><div>Sidst udført: <b>${lastLabel}</b></div>${partialLabel}<div>Næste udførelse: <b>${fmt(t.due)}</b></div></div><div class="actions"><button class="primary" data-done="${t.id}">Markér udført</button><button data-postpone="${t.id}">Udskyd</button><details><summary aria-label="Flere muligheder">···</summary><div class="more"><button data-partial="${t.id}">Delvist</button><button data-edit="${t.id}">Rediger</button><button class="warn" data-delete="${t.id}">Slet</button></div></details></div>${h.length?`<button class="history-link" data-taskhistory="${t.id}">Se historik (${h.length})</button>`:''}</article>`}
function render(){document.getElementById('tabs').innerHTML=[['today','I dag'],['week','Kommende'],['all','Alle opgaver'],['history','Historik'],['rooms','Områder']].map(([id,name])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${name}</button>`).join('');document.getElementById('areas').innerHTML=['Alle','Indendørs','Udendørs'].map(a=>`<button class="${area===a?'active':''}" data-area="${a}">${a}</button>`).join('');document.getElementById('heading').textContent={today:'I dag',week:'Kommende opgaver',all:'Alle opgaver',history:'Udført arbejde',rooms:'Rum og arbejdsområder'}[tab];document.getElementById('taskAdd').style.display=tab==='history'||tab==='rooms'?'none':'';document.getElementById('roomAdd').style.display=tab==='history'?'none':'';let html='';if(tab==='rooms'){html=db.rooms.filter(r=>area==='Alle'||r.kind===area).map(r=>`<div class="panel room"><div><b>${esc(r.name)}</b><div class="muted">${esc(r.kind)}</div></div><div class="actions"><button data-rename="${r.id}">Omdøb</button><button class="warn" data-rmroom="${r.id}">Slet</button></div></div>`).join('')}else if(tab==='history'){html=[...db.history].reverse().filter(h=>{let r=getRoom(h.room);return area==='Alle'||r?.kind===area}).map(h=>`<div class="panel"><b>${esc(h.title)}</b><div class="muted">${esc(getRoom(h.room)?.name||'Slettet område')} · ${fmt(h.date)} · ${esc(h.by)}${h.partial?' · Delvist udført':''}</div>${h.note?`<p>${esc(h.note)}</p>`:''}</div>`).join('')}else{let tasks=db.tasks.filter(t=>{let r=getRoom(t.room);return area==='Alle'||r?.kind===area}).sort((a,b)=>a.due.localeCompare(b.due));if(tab==='today'){let pending=tasks.filter(t=>t.due<=today()),ajour=tasks.filter(t=>t.due>today()),partial=pending.filter(t=>taskStatus(t).color==='yellow').length,late=pending.filter(t=>t.due<today()).length;let doneToday=db.history.filter(h=>h.date===today()&&!h.partial&&(area==='Alle'||getRoom(h.room)?.kind===area));html=`<div class="summary-stats"><div class="stat"><strong style="color:#C4454B">${pending.length-partial}</strong><small>Mangler / i dag</small></div><div class="stat"><strong style="color:#B48B19">${partial}</strong><small>Delvist</small></div><div class="stat"><strong style="color:#60764C">${ajour.length}</strong><small>Ajour</small></div></div><h3 class="section-title">Kræver handling</h3>${pending.length?pending.map(taskCard).join(''):'<div class="empty-small">Ingen opgaver, der kræver handling.</div>'}<h3 class="section-title">Ajour</h3>${ajour.length?ajour.map(taskCard).join(''):'<div class="empty-small">Ingen opgaver er ajour endnu.</div>'}${doneToday.length?`<h3 class="section-title">Udført i dag</h3>${doneToday.map(h=>`<div class="panel"><span class="status-dot status-green" style="display:inline-block;margin:0 8px 0 0"></span><b>${esc(h.title)}</b><div class="muted">${fmt(h.date)} · ${esc(h.by)}</div></div>`).join('')}`:''}`;}else{let shown=tab==='week'?tasks.filter(t=>t.due>today()&&t.due<=plus(today(),7)):tasks;html=shown.map(taskCard).join('')}}document.getElementById('content').innerHTML=html||'<div class="empty">Ingen opgaver at vise.</div>'}
function editTask(id){let t=db.tasks.find(x=>x.id===id);let f=document.getElementById('taskForm');f.reset();document.getElementById('roomSelect').innerHTML=db.rooms.map(r=>`<option value="${r.id}">${esc(r.kind)} · ${esc(r.name)}</option>`).join('');f.elements.id.value=t?.id||'';f.elements.title.value=t?.title||'';f.elements.room.value=t?.room||db.rooms[0]?.id;f.elements.frequency.value=t?.frequency??7;f.elements.assignee.value=t?.assignee||'Fælles';f.elements.due.value=t?.due||today();f.elements.notes.value=t?.notes||'';document.getElementById('taskFormTitle').textContent=t?'Rediger opgave':'Ny opgave';taskDialog.showModal()}
document.getElementById('taskAdd').onclick=()=>editTask();document.getElementById('roomAdd').onclick=()=>roomDialog.showModal();document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let f=e.target,id=f.elements.id.value;let t={id:id||uid(),title:f.elements.title.value.trim(),room:f.elements.room.value,frequency:Number(f.elements.frequency.value),assignee:f.elements.assignee.value,due:f.elements.due.value,notes:f.elements.notes.value.trim()};if(id)db.tasks=db.tasks.map(x=>x.id===id?{...x,...t}:x);else db.tasks.push(t);save();taskDialog.close();render()};document.getElementById('roomForm').onsubmit=e=>{e.preventDefault();let f=e.target;db.rooms.push({id:uid(),name:f.elements.name.value.trim(),kind:f.elements.kind.value});save();f.reset();roomDialog.close();render()};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.area){area=b.dataset.area;render();return}let id=b.dataset.done||b.dataset.partial||b.dataset.edit||b.dataset.postpone||b.dataset.delete||b.dataset.rename||b.dataset.rmroom||b.dataset.taskhistory;if(!id)return;let t=db.tasks.find(x=>x.id===id);if(b.dataset.taskhistory){let rows=historyFor(t);alert(rows.map(h=>`${fmt(h.date)} · ${h.partial?'Delvist':'Udført'} · ${h.by}${h.note?' · '+h.note:''}`).join('\n')||'Ingen historik');return}if(b.dataset.edit){editTask(id);return}if(b.dataset.done||b.dataset.partial){let who=prompt('Hvem udførte opgaven? (Mig eller Michael)','Mig');if(who===null)return;who=who.trim();if(!who)return;let partial=!!b.dataset.partial;let note=partial?prompt('Hvad blev udført?','')||'':'';db.history.push({id:uid(),taskId:t.id,title:t.title,room:t.room,date:today(),by:who,partial,note});if(!partial){if(t.frequency===0)db.tasks=db.tasks.filter(x=>x.id!==id);else t.due=plus(today(),t.frequency)}save();render();return}if(b.dataset.postpone){let next=prompt('Ny dato (ÅÅÅÅ-MM-DD)',plus(t.due,7));if(next&&/^\d{4}-\d{2}-\d{2}$/.test(next)){t.due=next;save();render()}return}if(b.dataset.delete){if(confirm('Slet opgaven?')){db.tasks=db.tasks.filter(x=>x.id!==id);save();render()}return}let r=getRoom(id);if(b.dataset.rename){let name=prompt('Nyt navn',r.name);if(name?.trim()){r.name=name.trim();save();render()}return}if(b.dataset.rmroom){if(db.tasks.some(t=>t.room===id)){alert('Flyt eller slet først opgaverne i dette område.');return}if(confirm('Slet området?')){db.rooms=db.rooms.filter(x=>x.id!==id);save();render()}}});render();
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
